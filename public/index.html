<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfoTech - Seguimiento de Pedidos</title>

  <link rel="icon" href="logoLibro.png" type="image/png">
  <!-- Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .tracking-card {
      max-width: 480px;
      width: 100%;
      border: none;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      background-color: rgba(255, 255, 255, 0.95);
    }

    .btn-primary {
      background: linear-gradient(45deg, #0d6efd, #0a58ca);
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Main Content -->
  <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center">
    <div class="card p-4 p-md-5 shadow-sm tracking-card">
      <div class="text-center mb-4">
        <!-- Logo -->
        <img src="logoCompleto.png" alt="Logo InfoTech" class="img-fluid mb-4" style="max-height: 80px;">
        <h1 class="h3 mb-3 fw-normal">Seguí el estado de tu pedido</h1>
      </div>

      <!-- Tracking Form -->
      <form id="tracking-form">
        <div class="form-floating mb-3">
          <input type="text" class="form-control form-control-lg" id="tracking-code"
            placeholder="Código de Seguimiento">
          <label for="tracking-code">Código de Seguimiento</label>
        </div>
        <div class="form-floating mb-3">
          <input type="tel" class="form-control form-control-lg" id="tracking-phone"
            placeholder="Tu Teléfono">
          <label for="tracking-phone">Tu Teléfono (con código de área)</label>
          <div class="form-text mt-2 text-muted">
            <i class="bi bi-info-circle-fill"></i> Escribilo <strong>sin el 0</strong> y <strong>sin el 15</strong>. <br>Ejemplo Córdoba: <strong>351</strong>5123456
          </div>
        </div>
        <button class="w-100 btn btn-lg btn-primary rounded-pill fw-bold" type="submit">Consultar Estado</button>
      </form>

      <!-- Result Container -->
      <div id="resultado-pedido" class="mt-4">
        <!-- Los resultados del pedido se inyectarán aquí con JavaScript -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="container text-center py-4">
    <p class="text-muted small mb-2">¿Necesitás ayuda?</p>
    <a href="https://wa.me/5493512282689" target="_blank" class="btn btn-success rounded-pill px-4 shadow-sm">
      <i class="bi bi-whatsapp"></i> ¿Consultas? Chateá con nosotros
    </a>
  </footer>

  <!-- Bootstrap JS Bundle (Popper.js included) via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Tu script de Firebase y lógica de la aplicación -->
  <script type="module" src="app.js"></script>

</body>

</html>
